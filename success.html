<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed - Phantomhood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <div class="brand">
        <span class="brand-name">Phantomhood</span>
        <img src="images/logo.png" alt="Phantomhood" class="logo-img">
    </div>
    <nav>
        <a href="index.html">Home</a>
    </nav>
</header>

<main class="checkout-page">
    <div class="checkout-card">
        <h1>Order Placed!</h1>
        <p class="checkout-sub">Thank you — please keep cash ready for delivery.</p>
        <p id="orderIdDisplay" class="checkout-sub"></p>
    </div>
</main>

<footer class="site-footer">
    <div class="footer-bottom">
        <p>&copy; 2026 Phantomhood. All rights reserved.</p>
    </div>
</footer>

<script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');
    if (orderId) {
        document.getElementById('orderIdDisplay').textContent = `Order ID: ${orderId}`;
    }
</script>

</body>
</html>
